# Base config — shared by paper and live. Mode-specific files override.
# All strategy/risk numbers live HERE, never hardcoded in strategy classes.

account:
  starting_capital: 500.00        # informational; live equity read from broker
  account_type: cash              # cash account => no PDT rule; T+1 settlement applies

universe:
  # Curated Dow-30 + Nasdaq-100 snapshot (deduplicated, ~114 liquid large/
  # mega-cap names), grouped into approximate sector buckets so max_per_bucket
  # stays a meaningful correlation cap at this scale. Hand-maintained, same
  # discipline as the prior 26-symbol list — NOT a live index feed; expect
  # membership drift over time and refresh periodically. Replaced the old
  # ETF/megacap list 2026-08-23 for the overnight_effect strategy, which
  # needs a much broader stock-selection universe than a handful of ETFs.
  buckets:
    technology: [AAPL, MSFT, NVDA, AVGO, ASML, ADBE, CSCO, AMD, QCOM, INTU,
                 AMAT, TXN, ADI, LRCX, PANW, MU, KLAC, SNPS, CDNS, MRVL,
                 NXPI, WDAY, FTNT, CDW, ZS, "ON", ANSS, TTD, TEAM, GFS,
                 SMCI, CRM, IBM, DDOG, CTSH]
    communication_services: [GOOGL, META, NFLX, TMUS, CMCSA, CHTR, WBD,
                              SIRI, DIS, VZ, EA]
    consumer_discretionary: [AMZN, TSLA, HD, MCD, NKE, BKNG, SBUX, MAR,
                              ORLY, ABNB, ROST, DASH, MELI, LULU]
    consumer_staples: [PG, WMT, KO, PEP, COST, MDLZ, KHC, DLTR, KDP, MNST,
                        CCEP, WBA]
    financials: [V, GS, AXP, TRV, JPM, PYPL]
    healthcare: [UNH, JNJ, MRK, AMGN, ISRG, VRTX, GILD, REGN, BIIB, MRNA,
                 DXCM, IDXX, GEHC, ILMN]
    industrials: [CAT, HON, BA, MMM, CSX, CTAS, ODFL, PAYX, CPRT, FAST,
                  VRSK, ROP, PCAR, CSGP]
    energy: [CVX, FANG, BKR]
    materials: [SHW, LIN]
    utilities: [AEP, EXC, XEL]
  min_price: 10                     # floor for the strategy's price filter
  min_avg_dollar_volume: 50000000   # $50M/day floor for the strategy's liquidity filter
  max_spread_pct: 0.05              # reject entry if spread > 5 bps of mid

# Single sleeve (strategies/composite.py is unused while there's only one).
# Replaced the trend_pullback + momentum_rotation swing sleeves 2026-08-23
# with overnight_effect (strategies/overnight_effect.py) — buys a basket at
# the close, sells it at the next open. Starting-point params below are
# UNVALIDATED: this resets the pipeline to Gate 1 (docs/GATES.md); real
# tuning is a scripts/sweep_params.py exercise, not done yet.
strategies:
  - name: overnight_effect
    params:
      buckets: [technology, communication_services, consumer_discretionary,
                consumer_staples, financials, healthcare, industrials,
                energy, materials, utilities]
      atr_period: 14
      stop_atr_mult: 2.5       # sizing anchor only — see strategy docstring;
                                # this never fires as a monitored exit
      min_atr_pct: 1.0         # volatility floor: guards the score's denominator
      min_price: 10            # skip low-price names (microstructure/gap noise)
      min_avg_dollar_volume: 50000000  # liquidity floor, applied per-candidate
      dollar_volume_lookback: 20
      top_n: 12                 # nightly basket size

risk:
  # Starting point for overnight_effect (set 2026-08-23, UNVALIDATED — see
  # the strategies: block comment above). Many small positions instead of a
  # few large ones is deliberate: for a strategy with zero intraday
  # monitoring, diversification across names IS the earnings/news gap-risk
  # control, not a stop.
  risk_per_trade_pct: 1.0       # % of equity risked between entry and stop
  max_position_notional_pct: 12 # single position <= 12% of equity
  max_gross_exposure_pct: 100   # cash account: never exceed settled cash
  max_concurrent_positions: 12  # nightly basket size ceiling (see strategy top_n)
  max_per_bucket: 3             # cap concentration within one sector bucket
  max_per_bucket_overrides: {}  # per-bucket cap tightening (e.g. bucket: 1);
                                # unused in the current config, kept for
                                # future universe changes
  daily_loss_halt_pct: 2.5      # realized+unrealized day loss => halt new entries
  weekly_loss_halt_pct: 5.0
  max_drawdown_halt_pct: 10.0   # peak-to-trough => full circuit breaker, manual reset
  settled_cash_only: true       # prevent good-faith violations in cash account
  day_trade_guard: true         # block same-day round trips except protective stops
  vol_target_pct: 0             # >0: shrink new-position risk when trailing
  vol_lookback_days: 20         #   realized vol exceeds this annualized %

execution:
  order_type_entry: limit       # marketable limit at mid + 1/2 spread cap
  entry_limit_offset_bps: 5
  order_type_exit: market       # exits must fill; slippage is the cost of certainty
  order_timeout_sec: 60         # unfilled entry limit => cancel, do not chase
  schedule:
    signal_time: "15:55"        # ET; overnight_effect: compute off an intraday
                                # snapshot and submit entries immediately
                                # (regular-hours notional market order, not
                                # queued) — see service/engine.py
    exit_time: "09:35"          # ET; force-sell every overnight position,
                                # unconditionally, at the open
    reconcile_time: "09:00"     # ET; plus always on startup

backtest:
  start: "2016-01-04"               # Alpaca free (IEX) history begins here
  commission_per_share: 0.0         # Alpaca: $0 commission on stocks/ETFs
  # Regulatory pass-through fees on SELLS (Alpaca invoices these; rates
  # change ~annually — verify against alpaca.markets docs when they reset):
  sec_fee_per_million: 27.80        # SEC Section 31 fee on sale proceeds
  taf_per_share: 0.000166           # FINRA TAF per share sold (cap $8.30/trade)
  slippage_model: spread_plus_bps   # fill at mid +/- half spread + extra bps
  extra_slippage_bps: 5
  partial_fill_prob: 0.0            # daily-bar sizes here always fill; keep hook
  drawdown_reset_sessions: 10       # simulated post-mortem cooldown (backtest only)

service:
  # 0.0.0.0 so the Docker port-publish (host-side "127.0.0.1:8765:8765") can
  # reach the process at all — Docker's bridge network can't forward a
  # published port to a process bound to the container's own loopback.
  # The security boundary lives on the host instead: ufw + publishing the
  # port only on the host's 127.0.0.1, with Tailscale for remote access.
  host: 0.0.0.0
  port: 8765

monitoring:
  disconnect_alert_min: 5           # CRIT alert after N minutes unreachable
  kill_after_disconnect_min: 15     # arm kill-on-reconnect (0 = disable);
                                    # stops are engine-monitored, so a long
                                    # outage means unprotected positions

alerts:
  channels: [telegram, email]
  # Default push-notification categories, seeded into journal/alert_prefs.json
  # on first run only (monitoring/alerts.py) — after that, the GUI Settings
  # tab's toggles are the source of truth and this list is ignored.
  alert_on: [engine, risk, order, summary, strategy, reconcile, fill,
             kill_switch, health]

logging:
  dir: logs
  level: INFO
  audit_db: journal/audit.sqlite
